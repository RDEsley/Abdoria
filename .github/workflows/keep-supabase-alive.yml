# Mantém o projeto Evolyn no Supabase ativo (free tier pausa após ~7 dias sem uso).
# Configure em GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_URL      → https://<ref>.supabase.co
#   SUPABASE_ANON_KEY → chave anon (Settings → API no Supabase)
#
# Horário: 00:00 America/Sao_Paulo (UTC-3) = 03:00 UTC

name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Evolyn (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase (auth + Postgres)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          missing=()
          [ -z "${SUPABASE_URL:-}" ] && missing+=("SUPABASE_URL")
          [ -z "${SUPABASE_ANON_KEY:-}" ] && missing+=("SUPABASE_ANON_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets ausentes: ${missing[*]}"
            echo "Adicione em Settings → Secrets and variables → Actions do repositório."
            exit 1
          fi

          BASE="${SUPABASE_URL%/}"

          echo "Pinging ${BASE} at $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC"

          auth_status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${BASE}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          echo "auth/v1/health → HTTP ${auth_status}"

          if [ "${auth_status}" -lt 200 ] || [ "${auth_status}" -ge 300 ]; then
            echo "::error::auth/v1/health falhou (HTTP ${auth_status})"
            exit 1
          fi

          rest_status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${BASE}/rest/v1/health_ping?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          echo "rest/v1/health_ping → HTTP ${rest_status}"

          if [ "${rest_status}" -lt 200 ] || [ "${rest_status}" -ge 300 ]; then
            echo "::error::rest/v1/health_ping falhou (HTTP ${rest_status})"
            exit 1
          fi

          echo "✔ Evolyn Supabase ativo — próximo ping agendado para 00:00 (Brasília)"
